services:
  - type: web
    name: teskari-tezlik
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: API_TOKEN
        sync: false          # Render dashboard dan kiritiladi
      - key: RENDER_EXTERNAL_URL
        fromService:
          type: web
          name: teskari-tezlik
          property: host
          prefix: "https://"
