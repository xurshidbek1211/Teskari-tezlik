<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🎨 Rasm Chizish</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --tg-theme-bg-color: #fff;
    --tg-theme-text-color: #222;
    --tg-theme-button-color: #2ea6ff;
    --tg-theme-button-text-color: #fff;
    --tg-theme-secondary-bg-color: #f0f0f0;
  }
  body {
    background: var(--tg-theme-bg-color);
    color: var(--tg-theme-text-color);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
    user-select: none;
  }

  /* ── TOP BAR ── */
  #topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 8px;
    background: var(--tg-theme-secondary-bg-color);
    border-bottom: 1px solid rgba(0,0,0,.1);
    flex-shrink: 0;
    gap: 6px;
  }
  #topbar button {
    border: none;
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity .15s;
    white-space: nowrap;
  }
  #topbar button:active { opacity: .7; }
  #btn-see-word {
    background: #ffd600;
    color: #222;
  }
  #btn-new-word {
    background: #43a047;
    color: #fff;
  }
  #btn-send {
    background: var(--tg-theme-button-color);
    color: var(--tg-theme-button-text-color);
    margin-left: auto;
  }

  /* ── WORD OVERLAY ── */
  #word-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,.65);
    z-index: 999;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 16px;
  }
  #word-overlay.show { display: flex; }
  #word-box {
    background: #fff;
    border-radius: 16px;
    padding: 28px 36px;
    text-align: center;
    box-shadow: 0 8px 32px rgba(0,0,0,.3);
    max-width: 90vw;
  }
  #word-box .label { font-size: 13px; color: #888; margin-bottom: 8px; }
  #word-box .word  { font-size: 28px; font-weight: 800; color: #1a1a2e; }
  #word-box .hint  { font-size: 12px; color: #aaa; margin-top: 8px; }
  #btn-close-word  {
    background: #fff;
    border: none;
    border-radius: 12px;
    padding: 10px 28px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(0,0,0,.2);
  }

  /* ── CANVAS WRAPPER ── */
  #canvas-wrap {
    flex: 1;
    position: relative;
    overflow: hidden;
    background: #fff;
    cursor: crosshair;
  }
  canvas#draw-canvas {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    display: block;
    touch-action: none;
  }

  /* ── TOOLBAR ── */
  #toolbar {
    background: var(--tg-theme-secondary-bg-color);
    border-top: 1px solid rgba(0,0,0,.1);
    padding: 6px 6px 8px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .tool-row {
    display: flex;
    gap: 5px;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
  }
  .tool-btn {
    border: 2px solid transparent;
    border-radius: 10px;
    width: 44px; height: 44px;
    font-size: 20px;
    background: #fff;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: border-color .15s, background .15s;
    box-shadow: 0 1px 4px rgba(0,0,0,.12);
    flex-shrink: 0;
  }
  .tool-btn:active { opacity: .75; }
  .tool-btn.active { border-color: var(--tg-theme-button-color); background: #e8f4ff; }

  /* Size slider */
  #size-slider {
    flex: 1;
    min-width: 80px;
    max-width: 140px;
    height: 4px;
    accent-color: var(--tg-theme-button-color);
    cursor: pointer;
  }
  #size-preview {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: #222;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  #size-dot {
    border-radius: 50%;
    background: #333;
    transition: width .1s, height .1s;
  }

  /* Color palette */
  .color-swatch {
    width: 30px; height: 30px;
    border-radius: 50%;
    border: 3px solid transparent;
    cursor: pointer;
    transition: border-color .1s, transform .1s;
    flex-shrink: 0;
    box-shadow: 0 1px 3px rgba(0,0,0,.2);
  }
  .color-swatch:active { transform: scale(.88); }
  .color-swatch.active { border-color: #1a1a2e; transform: scale(1.15); }
  #color-picker-btn {
    width: 30px; height: 30px;
    border-radius: 50%;
    border: 3px solid #ccc;
    background: conic-gradient(red, yellow, lime, cyan, blue, magenta, red);
    cursor: pointer;
    flex-shrink: 0;
    box-shadow: 0 1px 3px rgba(0,0,0,.2);
  }
  #color-picker-input {
    position: absolute; left: -9999px; opacity: 0;
    width: 1px; height: 1px;
  }

  /* Toast */
  #toast {
    position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,.75); color: #fff;
    border-radius: 20px; padding: 8px 18px;
    font-size: 13px; font-weight: 600;
    opacity: 0; transition: opacity .3s;
    pointer-events: none; z-index: 1000;
    white-space: nowrap;
  }
  #toast.show { opacity: 1; }

  /* Loading overlay */
  #loading {
    position: fixed; inset: 0;
    background: rgba(255,255,255,.9);
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 12px; z-index: 2000;
    font-size: 15px; color: #666;
  }
  .spinner {
    width: 36px; height: 36px;
    border: 4px solid #ddd;
    border-top-color: var(--tg-theme-button-color);
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- LOADING -->
<div id="loading"><div class="spinner"></div><span>Yuklanmoqda...</span></div>

<!-- WORD OVERLAY -->
<div id="word-overlay">
  <div id="word-box">
    <div class="label">🎨 Siz chizishingiz kerak:</div>
    <div class="word" id="current-word">...</div>
    <div class="hint">Bu so'zni chizing — yozib bo'lmaydi!</div>
  </div>
  <button id="btn-close-word">✅ Tushundim, chizishni boshlayman</button>
</div>

<!-- TOP BAR -->
<div id="topbar">
  <button id="btn-see-word">👀 Ko'rish</button>
  <button id="btn-new-word">⏩ Yangi</button>
  <button id="btn-send">📤 Yuborish</button>
</div>

<!-- CANVAS -->
<div id="canvas-wrap">
  <canvas id="draw-canvas"></canvas>
</div>

<!-- TOOLBAR -->
<div id="toolbar">
  <!-- Row 1: tools + size -->
  <div class="tool-row">
    <button class="tool-btn active" id="tool-pen"    title="Qalam">✏️</button>
    <button class="tool-btn"        id="tool-brush"  title="Mo'yqalam">🖌️</button>
    <button class="tool-btn"        id="tool-line"   title="Chiziq">📏</button>
    <button class="tool-btn"        id="tool-rect"   title="To'rtburchak">⬜</button>
    <button class="tool-btn"        id="tool-circle" title="Doira">⭕</button>
    <button class="tool-btn"        id="tool-eraser" title="O'chirg'ich">🧽</button>
    <div style="flex:1"></div>
    <div id="size-preview"><div id="size-dot" style="width:6px;height:6px"></div></div>
    <input type="range" id="size-slider" min="1" max="40" value="6">
  </div>

  <!-- Row 2: colors + undo/redo/clear -->
  <div class="tool-row">
    <div class="color-swatch active" data-color="#000000" style="background:#000"></div>
    <div class="color-swatch" data-color="#ffffff" style="background:#fff; border-color:#ccc !important"></div>
    <div class="color-swatch" data-color="#e53935" style="background:#e53935"></div>
    <div class="color-swatch" data-color="#fb8c00" style="background:#fb8c00"></div>
    <div class="color-swatch" data-color="#fdd835" style="background:#fdd835"></div>
    <div class="color-swatch" data-color="#43a047" style="background:#43a047"></div>
    <div class="color-swatch" data-color="#1e88e5" style="background:#1e88e5"></div>
    <div class="color-swatch" data-color="#8e24aa" style="background:#8e24aa"></div>
    <div class="color-swatch" data-color="#795548" style="background:#795548"></div>
    <div id="color-picker-btn" title="Rang tanlash"></div>
    <input type="color" id="color-picker-input" value="#000000">
    <div style="flex:1"></div>
    <button class="tool-btn" id="btn-undo"  title="Bekor qilish">↩️</button>
    <button class="tool-btn" id="btn-redo"  title="Qaytarish">↪️</button>
    <button class="tool-btn" id="btn-clear" title="Tozalash">🗑️</button>
  </div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<!-- COLOR PICKER (hidden) -->

<script>
(function(){
  const tg = window.Telegram?.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  // ── PARAMS ────────────────────────────────────────────────────────────────
  const params  = new URLSearchParams(location.search);
  const SESSION = params.get("session") || "";
  const CHAT_ID = params.get("chat_id") || "";
  const INIT_DATA = tg ? tg.initData : "";

  // ── CANVAS SETUP ──────────────────────────────────────────────────────────
  const wrap   = document.getElementById("canvas-wrap");
  const canvas = document.getElementById("draw-canvas");
  const ctx    = canvas.getContext("2d");

  let W, H;
  function resize() {
    W = canvas.width  = wrap.clientWidth;
    H = canvas.height = wrap.clientHeight;
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, W, H);
    redrawHistory();
  }
  window.addEventListener("resize", resize);

  // ── STATE ─────────────────────────────────────────────────────────────────
  let tool       = "pen";
  let color      = "#000000";
  let lineWidth  = 6;
  let drawing    = false;
  let startX=0, startY=0, lastX=0, lastY=0;
  let currentWord = null;

  // History (undo/redo)
  const MAX_HIST = 40;
  let history    = [];   // array of ImageData
  let redoStack  = [];

  function saveHistory() {
    history.push(ctx.getImageData(0, 0, W, H));
    if (history.length > MAX_HIST) history.shift();
    redoStack = [];
  }
  function undo() {
    if (!history.length) return;
    redoStack.push(ctx.getImageData(0, 0, W, H));
    ctx.putImageData(history.pop(), 0, 0);
  }
  function redo() {
    if (!redoStack.length) return;
    history.push(ctx.getImageData(0, 0, W, H));
    ctx.putImageData(redoStack.pop(), 0, 0);
  }
  function redrawHistory() {
    if (history.length) {
      ctx.putImageData(history[history.length - 1], 0, 0);
    } else {
      ctx.fillStyle = "#fff"; ctx.fillRect(0,0,W,H);
    }
  }
  function clearCanvas() {
    saveHistory();
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, W, H);
  }

  // ── DRAWING HELPERS ───────────────────────────────────────────────────────
  let snapShot = null; // for shapes preview

  function applyTool() {
    if (tool === "eraser") {
      ctx.globalCompositeOperation = "destination-out";
      ctx.strokeStyle = "rgba(0,0,0,1)";
    } else {
      ctx.globalCompositeOperation = "source-over";
      ctx.strokeStyle = color;
      ctx.fillStyle   = color;
    }
    if (tool === "brush") {
      ctx.lineWidth = lineWidth * 2.5;
      ctx.lineCap   = "round";
      ctx.lineJoin  = "round";
    } else {
      ctx.lineWidth = lineWidth;
      ctx.lineCap   = "round";
      ctx.lineJoin  = "round";
    }
  }

  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const src  = e.touches ? e.touches[0] : e;
    return {
      x: (src.clientX - rect.left) * (W / rect.width),
      y: (src.clientY - rect.top)  * (H / rect.height)
    };
  }

  function onStart(e) {
    e.preventDefault();
    drawing  = true;
    const p  = getPos(e);
    startX   = lastX = p.x;
    startY   = lastY = p.y;
    applyTool();
    if (["line","rect","circle"].includes(tool)) {
      snapShot = ctx.getImageData(0, 0, W, H);
    } else {
      saveHistory();
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
    }
  }

  function onMove(e) {
    if (!drawing) return;
    e.preventDefault();
    const p = getPos(e);
    applyTool();

    if (tool === "pen" || tool === "brush" || tool === "eraser") {
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
      lastX = p.x; lastY = p.y;

    } else if (tool === "line") {
      ctx.putImageData(snapShot, 0, 0);
      ctx.beginPath();
      ctx.moveTo(startX, startY);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();

    } else if (tool === "rect") {
      ctx.putImageData(snapShot, 0, 0);
      ctx.beginPath();
      ctx.strokeRect(startX, startY, p.x - startX, p.y - startY);

    } else if (tool === "circle") {
      ctx.putImageData(snapShot, 0, 0);
      const rx = Math.abs(p.x - startX) / 2;
      const ry = Math.abs(p.y - startY) / 2;
      const cx = Math.min(startX, p.x) + rx;
      const cy = Math.min(startY, p.y) + ry;
      ctx.beginPath();
      ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  function onEnd(e) {
    if (!drawing) return;
    drawing = false;
    if (["line","rect","circle"].includes(tool)) {
      saveHistory();
      snapShot = null;
    }
    ctx.beginPath();
    ctx.globalCompositeOperation = "source-over";
  }

  // Touch & mouse events
  ["mousedown","touchstart"].forEach(ev => canvas.addEventListener(ev, onStart, {passive:false}));
  ["mousemove","touchmove" ].forEach(ev => canvas.addEventListener(ev, onMove,  {passive:false}));
  ["mouseup","touchend","mouseleave","touchcancel"].forEach(ev => canvas.addEventListener(ev, onEnd));

  // ── TOOL BUTTONS ──────────────────────────────────────────────────────────
  const toolMap = {
    "tool-pen":    "pen",
    "tool-brush":  "brush",
    "tool-line":   "line",
    "tool-rect":   "rect",
    "tool-circle": "circle",
    "tool-eraser": "eraser",
  };
  document.querySelectorAll(".tool-btn[id^='tool-']").forEach(btn => {
    btn.addEventListener("click", () => {
      tool = toolMap[btn.id] || "pen";
      document.querySelectorAll(".tool-btn[id^='tool-']").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
    });
  });

  document.getElementById("btn-undo").addEventListener("click", undo);
  document.getElementById("btn-redo").addEventListener("click", redo);
  document.getElementById("btn-clear").addEventListener("click", () => {
    if (confirm("Kanvасni tozalaysizmi?")) clearCanvas();
  });

  // ── SIZE SLIDER ───────────────────────────────────────────────────────────
  const slider = document.getElementById("size-slider");
  const dot    = document.getElementById("size-dot");
  slider.addEventListener("input", () => {
    lineWidth = parseInt(slider.value);
    const s = Math.min(lineWidth * 1.6, 24);
    dot.style.width = dot.style.height = s + "px";
    dot.style.background = (tool === "eraser") ? "#ddd" : color;
  });

  // ── COLOR ─────────────────────────────────────────────────────────────────
  function setColor(c) {
    color = c;
    document.querySelectorAll(".color-swatch").forEach(s => {
      s.classList.toggle("active", s.dataset.color === c);
    });
    dot.style.background = color;
    if (tool === "eraser") {
      tool = "pen";
      document.querySelectorAll(".tool-btn[id^='tool-']").forEach(b=>b.classList.remove("active"));
      document.getElementById("tool-pen").classList.add("active");
    }
  }
  document.querySelectorAll(".color-swatch").forEach(sw => {
    sw.addEventListener("click", () => setColor(sw.dataset.color));
  });
  const colorPickerBtn   = document.getElementById("color-picker-btn");
  const colorPickerInput = document.getElementById("color-picker-input");
  colorPickerBtn.addEventListener("click", () => colorPickerInput.click());
  colorPickerInput.addEventListener("input", () => {
    setColor(colorPickerInput.value);
    // Remove active from swatches (custom color)
    document.querySelectorAll(".color-swatch").forEach(s=>s.classList.remove("active"));
  });

  // ── TOAST ─────────────────────────────────────────────────────────────────
  let toastTimer;
  function showToast(msg, ms=2200) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), ms);
  }

  // ── WORD OVERLAY ──────────────────────────────────────────────────────────
  document.getElementById("btn-close-word").addEventListener("click", () => {
    document.getElementById("word-overlay").classList.remove("show");
  });
  document.getElementById("word-overlay").addEventListener("click", (e) => {
    if (e.target === document.getElementById("word-overlay")) {
      document.getElementById("word-overlay").classList.remove("show");
    }
  });

  async function fetchWord() {
    const url = `/api/draw/word?session=${encodeURIComponent(SESSION)}&chat_id=${encodeURIComponent(CHAT_ID)}&init_data=${encodeURIComponent(INIT_DATA)}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error("word fetch failed: " + res.status);
    const data = await res.json();
    return data.word;
  }

  document.getElementById("btn-see-word").addEventListener("click", async () => {
    if (currentWord) {
      document.getElementById("current-word").textContent = currentWord;
      document.getElementById("word-overlay").classList.add("show");
      return;
    }
    try {
      currentWord = await fetchWord();
      document.getElementById("current-word").textContent = currentWord;
      document.getElementById("word-overlay").classList.add("show");
    } catch(e) {
      showToast("❌ So'zni yuklab bo'lmadi. Sessiya topilmadi.");
    }
  });

  // ── NEW WORD ──────────────────────────────────────────────────────────────
  document.getElementById("btn-new-word").addEventListener("click", async () => {
    try {
      const url = `/api/draw/new_word?session=${encodeURIComponent(SESSION)}&chat_id=${encodeURIComponent(CHAT_ID)}&init_data=${encodeURIComponent(INIT_DATA)}`;
      const res  = await fetch(url);
      if (!res.ok) throw new Error(res.status);
      const data = await res.json();
      currentWord = data.word;
      showToast("⏩ Yangi so'z berildi!");
    } catch(e) {
      showToast("❌ Yangi so'z olishda xatolik.");
    }
  });

  // ── SEND ──────────────────────────────────────────────────────────────────
  document.getElementById("btn-send").addEventListener("click", async () => {
    // Canvas bo'shmi?
    const tempCtx = document.createElement("canvas");
    tempCtx.width = W; tempCtx.height = H;
    const tctx = tempCtx.getContext("2d");
    tctx.fillStyle = "#fff"; tctx.fillRect(0,0,W,H);
    const blank = tempCtx.toDataURL();
    if (canvas.toDataURL() === blank) {
      showToast("⚠️ Kanvas bo'sh! Avval rasm chizing.");
      return;
    }

    document.getElementById("btn-send").disabled = true;
    document.getElementById("btn-send").textContent = "⏳...";
    showToast("📤 Rasm guruhga yuborilmoqda...", 4000);

    try {
      const imageBase64 = canvas.toDataURL("image/png");
      const body = {
        session_id:   SESSION,
        chat_id:      CHAT_ID,
        init_data:    INIT_DATA,
        image_base64: imageBase64
      };
      const res = await fetch("/api/draw/submit", {
        method:  "POST",
        headers: { "Content-Type": "application/json" },
        body:    JSON.stringify(body)
      });
      if (!res.ok) {
        const err = await res.json().catch(()=>({}));
        throw new Error(err.error || res.status);
      }
      showToast("✅ Rasm guruhga yuborildi!", 3000);
      setTimeout(() => {
        if (tg) tg.close();
      }, 2500);
    } catch(e) {
      showToast("❌ Xatolik: " + e.message, 3500);
      document.getElementById("btn-send").disabled = false;
      document.getElementById("btn-send").textContent = "📤 Yuborish";
    }
  });

  // ── INIT ──────────────────────────────────────────────────────────────────
  async function init() {
    resize();
    // Hide loading
    document.getElementById("loading").style.display = "none";
    // Auto-show word on open
    try {
      currentWord = await fetchWord();
      document.getElementById("current-word").textContent = currentWord;
      document.getElementById("word-overlay").classList.add("show");
    } catch(e) {
      // non-fatal: user can press 👀 Ko'rish
    }
  }

  init();
})();
</script>
</body>
</html>
